name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
        with:
          enable_kvm: false
          set_as_trusted_user: false
      - name: Build plugin
        run: nix build --no-link --print-build-logs
      - name: Test backend
        run: nix develop --command python3 -m unittest discover -s tests
